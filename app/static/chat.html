<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JARVIS - Chat Texte</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0a0a0f;color:#e6e6ff;font-family:-apple-system,sans-serif;height:100dvh;display:flex;flex-direction:column}
header{padding:16px 20px;border-bottom:1px solid #1e1e30;display:flex;justify-content:space-between;align-items:center}
header h1{font-size:18px;letter-spacing:1px}
header a{color:#3a5bff;text-decoration:none;font-size:13px}
#chat{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.bubble{max-width:85%;padding:12px 16px;border-radius:16px;font-size:15px;line-height:1.4;word-break:break-word}
.me{align-self:flex-end;background:#3a5bff;color:#fff}
.jarvis{align-self:flex-start;background:#1a1a2e;border:1px solid #2a2a40}
#bar{padding:12px;border-top:1px solid #1e1e30;display:flex;gap:8px;background:#0f0f1a}
#bar input{flex:1;background:#1a1a2e;border:1px solid #2a2a40;color:#fff;padding:12px 16px;border-radius:24px;outline:none}
#bar button{background:#3a5bff;color:#fff;border:none;padding:12px 20px;border-radius:24px;font-weight:bold}
#hint{font-size:12px;color:#666;padding:6px 16px;text-align:center}
</style>
</head>
<body>
<header>
  <h1>JARVIS - Chat</h1>
  <a href="/">🎤 Mode vocal</a>
</header>
<div id="hint">Écris ici -> JARVIS exécute comme à la voix et répond dans tes M01 Pro</div>
<div id="chat">
  <div class="bubble jarvis">Salut, je suis JARVIS. Écris ce que tu veux, j'exécute sur ton PC et je te réponds dans tes lunettes.</div>
</div>
<div id="bar">
  <input id="msg" placeholder="Ex: ouvre YouTube et cherche Tayc" onkeydown="if(event.key==='Enter')send()">
  <button onclick="send()">Envoyer</button>
</div>
<script>
const chat=document.getElementById('chat'), msg=document.getElementById('msg');
function add(t,cls){const d=document.createElement('div');d.className='bubble '+cls;d.textContent=t;chat.appendChild(d);chat.scrollTop=chat.scrollHeight;}
async function send(){
  const t=msg.value.trim(); if(!t) return;
  add(t,'me'); msg.value='';
  add('...','jarvis');
  const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:t})});
  const j=await r.json();
  chat.lastChild.remove();
  add(j.answer,'jarvis');
}
</script>
</body>
</html>
